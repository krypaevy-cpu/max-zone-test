<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Грин Ривер</title>

    <script src="https://st.max.ru/js/max-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            font-size: 18px;
        }

        button {
            font-size: 18px;
            padding: 12px 20px;
            margin-top: 10px;
        }

        #photo-preview {
            display: none;
            margin-top: 15px;
            max-width: 100%;
            height: auto;
        }

        #result {
            margin-top: 15px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h2>Цифровой паспорт зоны</h2>

<div id="content">
    Загрузка...
</div>


<div id="employee-panel" style="display:none; margin-top:25px;">

    <hr>

    <h3>Служебный режим</h3>

    <input
        type="file"
        id="photo-input"
        accept="image/*"
        capture="environment"
        style="display:none;"
    >

    <button id="photo-button">
        Сделать фото
    </button>

    <div
        id="photo-status"
        style="margin-top:15px;"
    ></div>

    <img
        id="photo-preview"
        alt="Фото уборки"
    >

    <br>

    <button
        id="clean-button"
        style="display:none;"
    >
        Уборка выполнена
    </button>

    <div id="result"></div>

</div>


<script>

/* ==================================================
   НАСТРОЙКИ
================================================== */

const API_URL =
    "https://functions.yandexcloud.net/d4e0v5uck2oc0924pbeg";

const EMPLOYEE_ID = 58699171;

/*
Фото специально уменьшаем перед отправкой.
Это необходимо, чтобы не получить HTTP 413.
*/

const MAX_PHOTO_SIZE = 800;
const JPEG_QUALITY = 0.45;


/* ==================================================
   ТЕКУЩИЕ ДАННЫЕ
================================================== */

let currentZoneId = null;
let currentUserId = null;

let photoBase64 = null;


/* ==================================================
   КАРТОЧКА ЗОНЫ
================================================== */

function showZone(zone) {

    const lastCleaning =
        zone.last_cleaning || "Нет данных";

    const status =
        zone.status || "Нет данных";

    document.getElementById("content").innerHTML =
        "<h3>" +
        zone.name +
        "</h3>" +

        "<p><b>Последняя уборка:</b> " +
        lastCleaning +
        "</p>" +

        "<p><b>Статус:</b> " +
        status +
        "</p>";
}


/* ==================================================
   ЗАГРУЗКА ЗОНЫ
================================================== */

async function loadZone() {

    const webApp = window.WebApp;

    currentZoneId =
        webApp &&
        webApp.initDataUnsafe &&
        webApp.initDataUnsafe.start_param;

    const user =
        webApp &&
        webApp.initDataUnsafe &&
        webApp.initDataUnsafe.user;

    if (user) {
        currentUserId = Number(user.id);
    }


    /*
    Режим для проверки из обычного браузера.
    Если MAX не передал start_param,
    используем тестовую зону.
    */

    if (!currentZoneId) {
        currentZoneId = "zone_test_01";
    }


    try {

        const response = await fetch(
            API_URL,
            {
                method: "GET",
                cache: "no-store"
            }
        );

        if (!response.ok) {

            throw new Error(
                "API HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if (
            data.status !== "ok" ||
            !data.zone
        ) {

            throw new Error(
                data.message ||
                "Зона не найдена"
            );
        }


        showZone(
            data.zone
        );


        /*
        Служебный режим показываем
        только сотруднику.
        */

        if (currentUserId === EMPLOYEE_ID) {

            document.getElementById(
                "employee-panel"
            ).style.display = "block";
        }


    } catch (error) {

        console.error(error);

        document.getElementById(
            "content"
        ).innerText =
            "Ошибка загрузки данных:\n" +
            error.message;
    }
}


/* ==================================================
   КНОПКА "СДЕЛАТЬ ФОТО"
================================================== */

document.getElementById(
    "photo-button"
).onclick = function () {

    document.getElementById(
        "photo-input"
    ).click();
};


/* ==================================================
   ОБРАБОТКА ФОТО
================================================== */

document.getElementById(
    "photo-input"
).addEventListener(
    "change",
    function (event) {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function (readerEvent) {

                const image =
                    new Image();


                image.onload =
                    function () {

                        let width =
                            image.width;

                        let height =
                            image.height;


                        /*
                        Уменьшаем фотографию,
                        сохраняя пропорции.
                        */

                        if (
                            width >
                            MAX_PHOTO_SIZE ||
                            height >
                            MAX_PHOTO_SIZE
                        ) {

                            if (width > height) {

                                height =
                                    Math.round(
                                        height *
                                        MAX_PHOTO_SIZE /
                                        width
                                    );

                                width =
                                    MAX_PHOTO_SIZE;

                            } else {

                                width =
                                    Math.round(
                                        width *
                                        MAX_PHOTO_SIZE /
                                        height
                                    );

                                height =
                                    MAX_PHOTO_SIZE;
                            }
                        }


                        const canvas =
                            document.createElement(
                                "canvas"
                            );

                        canvas.width =
                            width;

                        canvas.height =
                            height;


                        const context =
                            canvas.getContext(
                                "2d"
                            );


                        context.drawImage(
                            image,
                            0,
                            0,
                            width,
                            height
                        );


                        /*
                        Получаем уменьшенный JPEG.
                        */

                        const dataUrl =
                            canvas.toDataURL(
                                "image/jpeg",
                                JPEG_QUALITY
                            );


                        /*
                        Для API оставляем только
                        сам Base64 без заголовка
                        data:image/jpeg;base64,...
                        */

                        photoBase64 =
                            dataUrl.split(",")[1];


                        /*
                        Показываем фотографию.
                        */

                        const preview =
                            document.getElementById(
                                "photo-preview"
                            );

                        preview.src =
                            dataUrl;

                        preview.style.display =
                            "block";


                        document.getElementById(
                            "photo-status"
                        ).innerText =
                            "Фото сделано";


                        /*
                        Только после фотографии
                        появляется кнопка фиксации.
                        */

                        document.getElementById(
                            "clean-button"
                        ).style.display =
                            "inline-block";


                        document.getElementById(
                            "result"
                        ).innerText =
                            "";
                    };


                image.onerror =
                    function () {

                        document.getElementById(
                            "result"
                        ).innerText =
                            "Не удалось обработать фото";
                    };


                image.src =
                    readerEvent.target.result;
            };


        reader.onerror =
            function () {

                document.getElementById(
                    "result"
                ).innerText =
                    "Не удалось прочитать фото";
            };


        reader.readAsDataURL(
            file
        );
    }
);


/* ==================================================
   ФИКСАЦИЯ УБОРКИ
================================================== */

async function cleaningDone() {

    const result =
        document.getElementById(
            "result"
        );


    if (!photoBase64) {

        result.innerText =
            "Сначала сделайте фото";

        return;
    }


    result.innerText =
        "Фиксирую уборку...";


    /*
    Блокируем кнопку,
    чтобы случайно не создать две записи.
    */

    const cleanButton =
        document.getElementById(
            "clean-button"
        );

    cleanButton.disabled =
        true;


    try {

        const requestBody = {

            action:
                "cleaning_done",

            zone_id:
                currentZoneId,

            employee_id:
                currentUserId ||
                EMPLOYEE_ID,

            photo:
                photoBase64
        };


        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            requestBody
                        )
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                "API HTTP " +
                response.status +
                "\n" +
                errorText
            );
        }


        const data =
            await response.json();


        if (data.status !== "ok") {

            throw new Error(
                data.message ||
                "Неизвестная ошибка API"
            );
        }


        result.innerText =
            "Уборка зафиксирована";


        /*
        API возвращает обновлённую зону.
        */

        if (data.zone) {

            showZone(
                data.zone
            );
        }


        /*
        После успешной записи
        очищаем фотографию.
        */

        photoBase64 =
            null;


        document.getElementById(
            "photo-input"
        ).value =
            "";


        document.getElementById(
            "photo-preview"
        ).style.display =
            "none";


        document.getElementById(
            "photo-status"
        ).innerText =
            "";


        cleanButton.style.display =
            "none";


    } catch (error) {

        console.error(error);

        result.innerText =
            "ОШИБКА:\n" +
            error.message;


        cleanButton.disabled =
            false;
    }
}


/* ==================================================
   КНОПКА "УБОРКА ВЫПОЛНЕНА"
================================================== */

document.getElementById(
    "clean-button"
).onclick =
    cleaningDone;


/* ==================================================
   ЗАПУСК
================================================== */

loadZone();

</script>

</body>
</html>
