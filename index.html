<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Грин Ривер</title>

    <script src="https://st.max.ru/js/max-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            font-size: 18px;
            line-height: 1.45;
        }

        h2 {
            font-size: 28px;
        }

        h3 {
            font-size: 24px;
        }

        button,
        .photo-button {
            display: inline-block;
            font-size: 18px;
            padding: 14px 22px;
            border: 1px solid #777;
            background: #f2f2f2;
            color: #000;
            cursor: pointer;
            box-sizing: border-box;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #employee-panel {
            display: none;
            margin-top: 30px;
        }

        #photo-input {
            display: none;
        }

        #photo-preview {
            display: none;
            margin-top: 15px;
            margin-bottom: 15px;
            max-width: 100%;
            max-height: 350px;
        }

        #photo-status {
            margin-top: 10px;
            margin-bottom: 15px;
        }

        #result {
            margin-top: 15px;
            white-space: pre-wrap;
        }

        #error {
            margin-top: 15px;
            white-space: pre-wrap;
        }

        #clean-button {
            margin-top: 10px;
        }
    </style>
</head>

<body>

<h2>Цифровой паспорт зоны</h2>

<div id="content">
    Загрузка...
</div>

<div id="employee-panel">

    <hr>

    <h3>Служебный режим</h3>

    <label
        for="photo-input"
        class="photo-button"
    >
        Сделать фото
    </label>

    <input
        id="photo-input"
        type="file"
        accept="image/*"
        capture="environment"
    >

    <div id="photo-status"></div>

    <img
        id="photo-preview"
        alt="Фото после уборки"
    >

    <div>
        <button id="clean-button">
            Уборка выполнена
        </button>
    </div>

    <div id="result"></div>

</div>

<div id="error"></div>


<script>

const API_URL =
    "https://functions.yandexcloud.net/d4e0v5uck2oc0924pbeg";


let currentZoneId = null;
let currentUserId = null;

let selectedPhotoBase64 = null;


/* --------------------------------------------------
   ОПРЕДЕЛЕНИЕ ЗОНЫ И ПОЛЬЗОВАТЕЛЯ
-------------------------------------------------- */

function detectContext() {

    const webApp = window.WebApp;

    if (
        webApp &&
        webApp.initDataUnsafe
    ) {

        if (
            webApp.initDataUnsafe.start_param
        ) {
            currentZoneId =
                webApp.initDataUnsafe.start_param;
        }

        if (
            webApp.initDataUnsafe.user
        ) {
            currentUserId =
                Number(
                    webApp.initDataUnsafe.user.id
                );
        }
    }


    if (!currentZoneId) {

        const params =
            new URLSearchParams(
                window.location.search
            );

        currentZoneId =
            params.get("zone");
    }


    if (!currentZoneId) {
        currentZoneId =
            "zone_test_01";
    }
}


/* --------------------------------------------------
   ПОКАЗ КАРТОЧКИ ЗОНЫ
-------------------------------------------------- */

function showZone(zone) {

    document.getElementById(
        "content"
    ).innerHTML =

        "<h3>" +
        zone.name +
        "</h3>" +

        "<p><b>Последняя уборка:</b> " +
        (
            zone.last_cleaning ||
            "Нет данных"
        ) +
        "</p>" +

        "<p><b>Статус:</b> " +
        (
            zone.status ||
            "Нет данных"
        ) +
        "</p>";
}


/* --------------------------------------------------
   ЗАГРУЗКА ДАННЫХ ЗОНЫ
-------------------------------------------------- */

async function loadZone() {

    document.getElementById(
        "error"
    ).innerText = "";

    try {

        const response =
            await fetch(
                API_URL +
                "?ts=" +
                Date.now(),
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "API HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        if (
            data.status !== "ok" ||
            !data.zone
        ) {

            throw new Error(
                data.message ||
                "Не удалось получить данные зоны"
            );
        }

        showZone(
            data.zone
        );


        /*
        Пока служебный пользователь один
        */

        if (
            currentUserId === 58699171
        ) {

            document.getElementById(
                "employee-panel"
            ).style.display = "block";
        }

    } catch (error) {

        console.error(error);

        document.getElementById(
            "content"
        ).innerText =
            "Не удалось загрузить данные";

        document.getElementById(
            "error"
        ).innerText =
            "ОШИБКА:\n" +
            error.message;
    }
}


/* --------------------------------------------------
   ПОЛУЧЕНИЕ ФОТО С КАМЕРЫ
-------------------------------------------------- */

document.getElementById(
    "photo-input"
).addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) {

            selectedPhotoBase64 = null;

            document.getElementById(
                "photo-status"
            ).innerText = "";

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(loadEvent) {

                selectedPhotoBase64 =
                    loadEvent.target.result;

                const preview =
                    document.getElementById(
                        "photo-preview"
                    );

                preview.src =
                    selectedPhotoBase64;

                preview.style.display =
                    "block";


                document.getElementById(
                    "photo-status"
                ).innerText =
                    "Фото сделано";
            };


        reader.onerror =
            function() {

                selectedPhotoBase64 = null;

                document.getElementById(
                    "photo-status"
                ).innerText =
                    "Не удалось получить фото";
            };


        reader.readAsDataURL(
            file
        );
    }
);


/* --------------------------------------------------
   ФИКСАЦИЯ УБОРКИ
-------------------------------------------------- */

async function cleaningDone() {

    const result =
        document.getElementById(
            "result"
        );

    const cleanButton =
        document.getElementById(
            "clean-button"
        );


    if (!selectedPhotoBase64) {

        result.innerText =
            "Сначала сделайте фото";

        return;
    }


    result.innerText =
        "Фиксирую уборку...";

    cleanButton.disabled =
        true;


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        action:
                            "cleaning_done",

                        zone_id:
                            currentZoneId,

                        employee_id:
                            currentUserId,

                        photo:
                            selectedPhotoBase64
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "API HTTP " +
                response.status
            );
        }


        if (
            data.status !== "ok"
        ) {

            throw new Error(
                data.message ||
                "Не удалось зафиксировать уборку"
            );
        }


        if (data.zone) {

            showZone(
                data.zone
            );
        }


        result.innerText =
            "Уборка зафиксирована\n" +
            (
                data.zone &&
                data.zone.last_cleaning
                    ? data.zone.last_cleaning
                    : ""
            );


        /*
        После успешной фиксации
        очищаем фотографию
        */

        selectedPhotoBase64 =
            null;


        document.getElementById(
            "photo-input"
        ).value = "";


        const preview =
            document.getElementById(
                "photo-preview"
            );

        preview.src = "";
        preview.style.display =
            "none";


        document.getElementById(
            "photo-status"
        ).innerText = "";


    } catch (error) {

        console.error(error);

        result.innerText =
            "ОШИБКА:\n" +
            error.message;

    } finally {

        cleanButton.disabled =
            false;
    }
}


/* --------------------------------------------------
   КНОПКА УБОРКИ
-------------------------------------------------- */

document.getElementById(
    "clean-button"
).onclick =
    cleaningDone;


/* --------------------------------------------------
   СТАРТ
-------------------------------------------------- */

detectContext();
loadZone();

</script>

</body>
</html>
