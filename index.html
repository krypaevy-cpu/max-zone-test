<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Грин Ривер</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            font-size: 18px;
            line-height: 1.45;
        }

        h2 {
            font-size: 28px;
        }

        h3 {
            font-size: 23px;
        }

        #last-cleaning-photo,
        #photo-preview {
            display: block;
            max-width: 100%;
            height: auto;
            margin-top: 15px;
            border-radius: 8px;
        }

        #photo-preview {
            display: none;
        }

        #employee-status {
            margin-top: 25px;
            padding: 18px;
            border: 1px solid #ccc;
            border-radius: 10px;
            display: none;
        }

        #photo-input {
            display: none;
        }

        #camera-button {
            display: none;
            width: 100%;
            font-size: 22px;
            padding: 18px;
            margin-top: 18px;
        }

        #error {
            margin-top: 15px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h2>Цифровой паспорт зоны</h2>

<div id="content">
    Загрузка...
</div>

<div id="employee-status"></div>

<input
    id="photo-input"
    type="file"
    accept="image/*"
    capture="environment"
>

<button id="camera-button">
    Сделать фото
</button>

<img
    id="photo-preview"
    alt="Фото уборки"
>

<div id="error"></div>


<script>

/* ==================================================
   НАСТРОЙКИ
================================================== */

const API_URL =
    "https://functions.yandexcloud.net/d4e0v5uck2oc0924pbeg";

const DEFAULT_ZONE_ID =
    "zone_test_01";

const EMPLOYEE_ID =
    58699171;

const MAX_PHOTO_SIZE =
    800;

const JPEG_QUALITY =
    0.45;


/* ==================================================
   СОСТОЯНИЕ
================================================== */

let currentZoneId = null;

let photoBase64 = null;

let employeeMode = false;


/* ==================================================
   СЛУЖЕБНЫЙ РЕЖИМ
================================================== */

function setupEmployeeMode() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    if (
        params.get("employee") === "1"
    ) {

        localStorage.setItem(
            "green_river_employee",
            "1"
        );
    }

    if (
        params.get("logout") === "1"
    ) {

        localStorage.removeItem(
            "green_river_employee"
        );
    }

    employeeMode =
        localStorage.getItem(
            "green_river_employee"
        ) === "1";
}


/* ==================================================
   ОПРЕДЕЛЕНИЕ ЗОНЫ
================================================== */

function detectZone() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    currentZoneId =
        params.get("zone") ||
        DEFAULT_ZONE_ID;
}


/* ==================================================
   КАРТОЧКА ЗОНЫ
================================================== */

function showZone(zone) {

    const lastCleaning =
        zone.last_cleaning ||
        "Нет данных";

    const status =
        zone.status ||
        "Нет данных";

    let photoHtml = "";

    if (zone.photo_url) {

        photoHtml =
            "<p><b>Фото последней уборки:</b></p>" +

            "<img " +
            "id=\"last-cleaning-photo\" " +
            "src=\"" +
            zone.photo_url +
            "\" " +
            "alt=\"Фото последней уборки\"" +
            ">";
    }

    document.getElementById(
        "content"
    ).innerHTML =

        "<h3>" +
        zone.name +
        "</h3>" +

        "<p><b>Последняя уборка:</b> " +
        lastCleaning +
        "</p>" +

        "<p><b>Статус:</b> " +
        status +
        "</p>" +

        photoHtml;
}


/* ==================================================
   ПОЛУЧЕНИЕ КАРТОЧКИ
================================================== */

async function loadZone() {

    try {

        const response =
            await fetch(

                API_URL +

                "?zone=" +
                encodeURIComponent(
                    currentZoneId
                ) +

                "&ts=" +
                Date.now(),

                {
                    method: "GET",
                    cache: "no-store"
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            data.status !== "ok"
        ) {

            throw new Error(
                data.message ||
                "Ошибка загрузки зоны"
            );
        }

        showZone(
            data.zone
        );

    } catch (error) {

        showError(
            error.message
        );
    }
}


/* ==================================================
   КАСАНИЕ NFC СОТРУДНИКОМ
================================================== */

async function employeeTouch() {

    const statusBox =
        document.getElementById(
            "employee-status"
        );

    statusBox.style.display =
        "block";

    statusBox.innerHTML =
        "Определяю действие...";


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            action:
                                "touch",

                            zone_id:
                                currentZoneId,

                            employee_id:
                                EMPLOYEE_ID
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            data.status !== "ok"
        ) {

            throw new Error(
                data.message ||
                "Ошибка фиксации касания"
            );
        }


        /* ------------------------------------------
           ПЕРВОЕ КАСАНИЕ
        ------------------------------------------ */

        if (
            data.result === "STARTED"
        ) {

            statusBox.innerHTML =
                "<h3>Уборка начата</h3>" +
                "<p>Начало работ зафиксировано</p>";

            return;
        }


        /* ------------------------------------------
           ВТОРОЕ КАСАНИЕ
        ------------------------------------------ */

        if (
            data.result === "NEED_PHOTO"
        ) {

            statusBox.innerHTML =
                "<h3>Завершение уборки</h3>" +

                "<p>Уборка начата: " +
                data.started_at +
                "</p>" +

                "<p>Сделайте фото результата</p>";


            document.getElementById(
                "camera-button"
            ).style.display =
                "block";

            return;
        }


        throw new Error(
            "Неизвестный ответ API"
        );


    } catch (error) {

        showError(
            error.message
        );
    }
}


/* ==================================================
   ЗАПУСК КАМЕРЫ
================================================== */

document.getElementById(
    "camera-button"
).onclick =
    function () {

        document.getElementById(
            "photo-input"
        ).click();
    };


/* ==================================================
   ОБРАБОТКА ФОТО
================================================== */

document.getElementById(
    "photo-input"
).addEventListener(

    "change",

    function (event) {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }


        const statusBox =
            document.getElementById(
                "employee-status"
            );


        statusBox.innerHTML =
            "Обрабатываю фото...";


        const reader =
            new FileReader();


        reader.onload =
            function (readerEvent) {

                const image =
                    new Image();


                image.onload =
                    function () {

                        let width =
                            image.width;

                        let height =
                            image.height;


                        if (
                            width >
                            MAX_PHOTO_SIZE ||

                            height >
                            MAX_PHOTO_SIZE
                        ) {

                            if (
                                width >
                                height
                            ) {

                                height =
                                    Math.round(

                                        height *

                                        MAX_PHOTO_SIZE /

                                        width
                                    );

                                width =
                                    MAX_PHOTO_SIZE;

                            } else {

                                width =
                                    Math.round(

                                        width *

                                        MAX_PHOTO_SIZE /

                                        height
                                    );

                                height =
                                    MAX_PHOTO_SIZE;
                            }
                        }


                        const canvas =
                            document.createElement(
                                "canvas"
                            );


                        canvas.width =
                            width;

                        canvas.height =
                            height;


                        const context =
                            canvas.getContext(
                                "2d"
                            );


                        context.drawImage(
                            image,
                            0,
                            0,
                            width,
                            height
                        );


                        const dataUrl =
                            canvas.toDataURL(
                                "image/jpeg",
                                JPEG_QUALITY
                            );


                        photoBase64 =
                            dataUrl.split(",")[1];


                        const preview =
                            document.getElementById(
                                "photo-preview"
                            );


                        preview.src =
                            dataUrl;


                        preview.style.display =
                            "block";


                        /*
                        Фото уже сделано.
                        Никакой кнопки подтверждения.
                        Сразу завершаем уборку.
                        */

                        finishCleaning();
                    };


                image.onerror =
                    function () {

                        showError(
                            "Не удалось обработать фото"
                        );
                    };


                image.src =
                    readerEvent.target.result;
            };


        reader.onerror =
            function () {

                showError(
                    "Не удалось прочитать фото"
                );
            };


        reader.readAsDataURL(
            file
        );
    }
);


/* ==================================================
   АВТОМАТИЧЕСКОЕ ЗАВЕРШЕНИЕ
================================================== */

async function finishCleaning() {

    const statusBox =
        document.getElementById(
            "employee-status"
        );


    statusBox.innerHTML =
        "Фиксирую завершение уборки...";


    document.getElementById(
        "camera-button"
    ).style.display =
        "none";


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            action:
                                "finish_cleaning",

                            zone_id:
                                currentZoneId,

                            employee_id:
                                EMPLOYEE_ID,

                            photo:
                                photoBase64
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            data.status !== "ok"
        ) {

            throw new Error(
                data.message ||
                "Ошибка завершения уборки"
            );
        }


        statusBox.innerHTML =
            "<h3>Уборка завершена</h3>" +

            "<p>Результат зафиксирован</p>";


        if (
            data.zone
        ) {

            showZone(
                data.zone
            );
        }


        photoBase64 =
            null;


    } catch (error) {

        showError(
            error.message
        );
    }
}


/* ==================================================
   ОШИБКИ
================================================== */

function showError(message) {

    document.getElementById(
        "error"
    ).innerText =
        "ОШИБКА:\n" +
        message;
}


/* ==================================================
   ЗАПУСК
================================================== */

async function start() {

    setupEmployeeMode();

    detectZone();

    await loadZone();


    /*
    Если телефон авторизован как служебный,
    само открытие страницы после NFC
    считается касанием зоны.
    */

    if (
        employeeMode
    ) {

        await employeeTouch();
    }
}


start();

</script>

</body>
</html>
