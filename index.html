<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Грин Ривер</title>

    <script src="https://st.max.ru/js/max-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            font-size: 18px;
            line-height: 1.45;
        }

        h2 {
            font-size: 28px;
        }

        h3 {
            font-size: 24px;
        }

        button {
            font-size: 18px;
            padding: 14px 22px;
            cursor: pointer;
        }

        #employee-panel {
            display: none;
            margin-top: 30px;
        }

        #result {
            margin-top: 15px;
            white-space: pre-wrap;
        }

        #error {
            margin-top: 15px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h2>Цифровой паспорт зоны</h2>

<div id="content">
    Загрузка...
</div>

<div id="employee-panel">

    <hr>

    <h3>Служебный режим</h3>

    <button id="clean-button">
        Уборка выполнена
    </button>

    <div id="result"></div>

</div>

<div id="error"></div>


<script>

/*
--------------------------------------------------
НАШ API В YANDEX CLOUD
--------------------------------------------------
*/

const API_URL =
    "https://functions.yandexcloud.net/d4e0v5uck2oc0924pbeg";


/*
--------------------------------------------------
ТЕКУЩИЕ ПАРАМЕТРЫ
--------------------------------------------------
*/

let currentZoneId = null;
let currentUserId = null;


/*
--------------------------------------------------
ОПРЕДЕЛЯЕМ ЗОНУ И ПОЛЬЗОВАТЕЛЯ
--------------------------------------------------
*/

function detectContext() {

    /*
    Вариант 1.
    Если страница открыта через MAX Mini App,
    получаем start_param и пользователя.
    */

    const webApp = window.WebApp;

    if (
        webApp &&
        webApp.initDataUnsafe
    ) {

        if (
            webApp.initDataUnsafe.start_param
        ) {
            currentZoneId =
                webApp.initDataUnsafe.start_param;
        }

        if (
            webApp.initDataUnsafe.user
        ) {
            currentUserId =
                Number(
                    webApp.initDataUnsafe.user.id
                );
        }
    }


    /*
    Вариант 2.
    Если страницу открыли обычной ссылкой,
    зона может передаваться так:

    ?zone=zone_test_01
    */

    if (!currentZoneId) {

        const params =
            new URLSearchParams(
                window.location.search
            );

        currentZoneId =
            params.get("zone");
    }


    /*
    Пока у нас одна тестовая зона.
    Если параметр не получен,
    используем её.
    */

    if (!currentZoneId) {
        currentZoneId =
            "zone_test_01";
    }
}


/*
--------------------------------------------------
ПОКАЗ КАРТОЧКИ ЗОНЫ
--------------------------------------------------
*/

function showZone(zone) {

    document.getElementById(
        "content"
    ).innerHTML =

        "<h3>" +
        zone.name +
        "</h3>" +

        "<p><b>Последняя уборка:</b> " +
        (
            zone.last_cleaning ||
            "Нет данных"
        ) +
        "</p>" +

        "<p><b>Статус:</b> " +
        (
            zone.status ||
            "Нет данных"
        ) +
        "</p>";
}


/*
--------------------------------------------------
ЧТЕНИЕ ДАННЫХ ИЗ YDB ЧЕРЕЗ CLOUD FUNCTION
--------------------------------------------------
*/

async function loadZone() {

    document.getElementById(
        "error"
    ).innerText = "";

    try {

        const response =
            await fetch(
                API_URL +
                "?ts=" +
                Date.now(),
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "API HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        if (
            data.status !== "ok" ||
            !data.zone
        ) {

            throw new Error(
                data.message ||
                "Не удалось получить данные зоны"
            );
        }

        showZone(
            data.zone
        );


        /*
        Пока сотрудник только один:
        MAX user_id = 58699171
        */

        if (
            currentUserId === 58699171
        ) {

            document.getElementById(
                "employee-panel"
            ).style.display = "block";
        }

    } catch (error) {

        console.error(error);

        document.getElementById(
            "content"
        ).innerText =
            "Не удалось загрузить данные";

        document.getElementById(
            "error"
        ).innerText =
            "ОШИБКА:\n" +
            error.message;
    }
}


/*
--------------------------------------------------
ФИКСАЦИЯ УБОРКИ
--------------------------------------------------
*/

async function cleaningDone() {

    const result =
        document.getElementById(
            "result"
        );

    result.innerText =
        "Фиксирую уборку...";

    document.getElementById(
        "clean-button"
    ).disabled = true;

    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        action:
                            "cleaning_done",
                        zone_id:
                            currentZoneId,
                        employee_id:
                            currentUserId
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                "API HTTP " +
                response.status
            );
        }

        if (
            data.status !== "ok"
        ) {

            throw new Error(
                data.message ||
                "Не удалось зафиксировать уборку"
            );
        }


        /*
        Показываем обновлённые данные,
        которые вернула YDB.
        */

        if (data.zone) {
            showZone(
                data.zone
            );
        }


        result.innerText =
            "Уборка зафиксирована\n" +
            (
                data.zone &&
                data.zone.last_cleaning
                    ? data.zone.last_cleaning
                    : ""
            );

    } catch (error) {

        console.error(error);

        result.innerText =
            "ОШИБКА:\n" +
            error.message;

    } finally {

        document.getElementById(
            "clean-button"
        ).disabled = false;
    }
}


/*
--------------------------------------------------
КНОПКА
--------------------------------------------------
*/

document.getElementById(
    "clean-button"
).onclick =
    cleaningDone;


/*
--------------------------------------------------
СТАРТ
--------------------------------------------------
*/

detectContext();
loadZone();

</script>

</body>
</html>
