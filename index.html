<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Грин Ривер</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            font-size: 18px;
            line-height: 1.45;
            color: #222;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 18px;
        }

        h3 {
            font-size: 22px;
            margin-top: 18px;
            margin-bottom: 10px;
        }

        button {
            font-size: 17px;
            padding: 12px 18px;
            margin-top: 10px;
            margin-right: 6px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 16px;
            margin-top: 14px;
            background: #fff;
        }

        .warning {
            border-left: 5px solid #c77a00;
        }

        .danger {
            border-left: 5px solid #b92c2c;
        }

        .ok {
            border-left: 5px solid #2f7d4a;
        }

        .metric {
            margin: 7px 0;
        }

        .metric b {
            display: inline-block;
            min-width: 155px;
        }

        .role {
            font-size: 14px;
            color: #666;
            margin-bottom: 16px;
        }

        .big-status {
            font-size: 22px;
            font-weight: bold;
            margin: 10px 0;
        }

        #last-cleaning-photo,
        #photo-preview {
            display: block;
            max-width: 100%;
            height: auto;
            margin-top: 12px;
            border-radius: 8px;
        }

        #photo-preview {
            display: none;
        }

        #photo-input {
            display: none;
        }

        #camera-button {
            display: none;
            width: 100%;
            font-size: 20px;
            padding: 16px;
        }

        #employee-status {
            margin-top: 20px;
        }

        #error {
            margin-top: 15px;
            white-space: pre-wrap;
        }

        .actions {
            margin-top: 18px;
        }

        .small {
            font-size: 14px;
            color: #666;
        }

        .checklist-item {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .checklist-item:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>

<h2>Цифровой паспорт зоны</h2>

<div id="role-info"></div>

<div id="content">
    Загрузка...
</div>

<div id="employee-status"></div>

<input
    id="photo-input"
    type="file"
    accept="image/*"
    capture="environment"
>

<button id="camera-button">
    Сделать фото результата
</button>

<div id="manager-panel"></div>

<div id="cleaning-manager-panel"></div>

<div id="inspector-panel"></div>

<img
    id="photo-preview"
    alt="Фото уборки"
>

<div id="error"></div>


<script>

/* ==================================================
   НАСТРОЙКИ
================================================== */

const API_URL =
    "https://functions.yandexcloud.net/d4e0v5uck2oc0924pbeg";

const OSK_API_URL =
    "https://functions.yandexcloud.net/d4erme2ve77oddv1r6cc";

const DEFAULT_ZONE_ID =
    "zone_test_01";

const EMPLOYEE_ID =
    58699171;

const INSPECTOR_ID =
    58699171;

const TEST_OSK_TASK_ID =
    "task_osk_01";

const MAX_PHOTO_SIZE =
    800;

const JPEG_QUALITY =
    0.45;


/* ==================================================
   СОСТОЯНИЕ
================================================== */

let currentZoneId = null;

let currentRole = "resident";

let photoBase64 = null;


/* ==================================================
   РОЛИ
================================================== */

function setupRole() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const roleFromUrl =
        params.get("role");

    const allowedRoles = [
        "resident",
        "cleaner",
        "manager",
        "cleaning_manager",
        "inspector"
    ];


    if (
        roleFromUrl &&
        allowedRoles.includes(roleFromUrl)
    ) {

        localStorage.setItem(
            "green_river_role",
            roleFromUrl
        );
    }


    currentRole =
        localStorage.getItem(
            "green_river_role"
        ) ||
        "resident";
}


/* ==================================================
   ОПРЕДЕЛЕНИЕ ЗОНЫ
================================================== */

function detectZone() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    currentZoneId =
        params.get("zone") ||
        DEFAULT_ZONE_ID;
}


/* ==================================================
   НАЗВАНИЕ РОЛИ
================================================== */

function showRole() {

    const names = {

        resident:
            "Житель",

        cleaner:
            "Сотрудник клининга",

        manager:
            "Управляющий МКД",

        cleaning_manager:
            "Руководитель подрядчика по клинингу",

        inspector:
            "Инженер строительного контроля"
    };


    document.getElementById(
        "role-info"
    ).innerHTML =

        "<div class=\"role\">" +
        "Режим: <b>" +
        names[currentRole] +
        "</b></div>";
}


/* ==================================================
   БАЗОВАЯ КАРТОЧКА ЗОНЫ
================================================== */

function showZone(zone) {

    const lastCleaning =
        zone.last_cleaning ||
        "Нет данных";

    const status =
        zone.status ||
        "Нет данных";

    let photoHtml = "";


    if (zone.photo_url) {

        photoHtml =
            "<p><b>Фото последней уборки:</b></p>" +

            "<a href=\"" +
            zone.photo_url +
            "\" target=\"_blank\">" +

            "<img " +
            "id=\"last-cleaning-photo\" " +
            "src=\"" +
            zone.photo_url +
            "\" " +
            "alt=\"Фото последней уборки\"" +
            ">" +

            "</a>";
    }


    document.getElementById(
        "content"
    ).innerHTML =

        "<div class=\"card\">" +

        "<h3>" +
        zone.name +
        "</h3>" +

        "<p><b>Последняя уборка:</b> " +
        lastCleaning +
        "</p>" +

        "<p><b>Статус:</b> " +
        status +
        "</p>" +

        photoHtml +

        "</div>";
}


/* ==================================================
   КАРТОЧКА УПРАВЛЯЮЩЕГО
================================================== */

function showManagerPanel(zone) {

    document.getElementById(
        "manager-panel"
    ).innerHTML =

        "<div class=\"card warning\">" +

        "<h3>Контроль выполнения</h3>" +

        "<div class=\"metric\">" +
        "<b>Плановая уборка:</b> 10:00" +
        "</div>" +

        "<div class=\"metric\">" +
        "<b>Начало:</b> 10:17" +
        "</div>" +

        "<div class=\"metric\">" +
        "<b>Завершение:</b> " +
        (zone.last_cleaning || "—") +
        "</div>" +

        "<div class=\"metric\">" +
        "<b>Отклонение:</b> +17 мин" +
        "</div>" +

        "<div class=\"metric\">" +
        "<b>Исполнитель:</b> Иванова Н." +
        "</div>" +

        "<div class=\"metric\">" +
        "<b>Длительность:</b> 14 мин" +
        "</div>" +

        "</div>" +

        "<div class=\"card\">" +

        "<h3>Статистика зоны за 7 дней</h3>" +

        "<div class=\"metric\"><b>По плану:</b> 7</div>" +
        "<div class=\"metric\"><b>Выполнено:</b> 7</div>" +
        "<div class=\"metric\"><b>В срок:</b> 5</div>" +
        "<div class=\"metric\"><b>С нарушением:</b> 2</div>" +

        "</div>" +

        "<div class=\"actions\">" +

        "<button>Повторная уборка</button>" +
        "<button>Зафиксировать нарушение</button>" +
        "<button>Дашборд дома</button>" +

        "</div>";
}


/* ==================================================
   КАРТОЧКА РУКОВОДИТЕЛЯ КЛИНИНГА
================================================== */

function showCleaningManagerPanel(zone) {

    document.getElementById(
        "cleaning-manager-panel"
    ).innerHTML =

        "<div class=\"card warning\">" +

        "<h3>Исполнение задания</h3>" +

        "<div class=\"metric\"><b>Исполнитель:</b> Иванова Н.</div>" +
        "<div class=\"metric\"><b>План:</b> 10:00–10:15</div>" +
        "<div class=\"metric\"><b>Факт:</b> 10:17–10:31</div>" +
        "<div class=\"metric\"><b>Отклонение:</b> +17 мин</div>" +
        "<div class=\"metric\"><b>Длительность:</b> 14 мин</div>" +

        "</div>" +

        "<div class=\"card\">" +

        "<h3>Маршрут сотрудника</h3>" +

        "<div class=\"metric\"><b>Текущая зона:</b> " +
        zone.name +
        "</div>" +

        "<div class=\"metric\"><b>Следующая зона:</b> Подъезд 2, этаж 2</div>" +
        "<div class=\"metric\"><b>План следующей:</b> 10:30</div>" +
        "<div class=\"metric\"><b>Отставание:</b> 12 мин</div>" +

        "</div>" +

        "<div class=\"card\">" +

        "<h3>Исполнитель за 30 дней</h3>" +

        "<div class=\"metric\"><b>Заданий:</b> 42</div>" +
        "<div class=\"metric\"><b>В срок:</b> 38</div>" +
        "<div class=\"metric\"><b>С нарушением:</b> 4</div>" +

        "</div>" +

        "<div class=\"actions\">" +

        "<button>Назначить повторную уборку</button>" +
        "<button>Карточка сотрудника</button>" +
        "<button>Дашборд клининга</button>" +

        "</div>";
}


/* ==================================================
   ЗАГРУЗКА ОБЫЧНОЙ ЗОНЫ
================================================== */

async function loadZone() {

    try {

        const response =
            await fetch(

                API_URL +

                "?zone=" +
                encodeURIComponent(
                    currentZoneId
                ) +

                "&ts=" +
                Date.now(),

                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            data.status !== "ok"
        ) {

            throw new Error(
                data.message ||
                "Ошибка загрузки зоны"
            );
        }


        showZone(data.zone);


        if (currentRole === "manager") {

            showManagerPanel(
                data.zone
            );
        }


        if (
            currentRole ===
            "cleaning_manager"
        ) {

            showCleaningManagerPanel(
                data.zone
            );
        }


    } catch (error) {

        showError(
            error.message
        );
    }
}


/* ==================================================
   КАСАНИЕ УБОРЩИЦЫ
================================================== */

async function cleanerTouch() {

    const statusBox =
        document.getElementById(
            "employee-status"
        );


    statusBox.innerHTML =
        "<div class=\"card\">" +
        "Определяю действие..." +
        "</div>";


    try {

        const response =
            await fetch(

                API_URL,

                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "touch",

                            zone_id:
                                currentZoneId,

                            employee_id:
                                EMPLOYEE_ID
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            data.status !== "ok"
        ) {

            throw new Error(
                data.message ||
                "Ошибка фиксации"
            );
        }


        if (
            data.result ===
            "STARTED"
        ) {

            statusBox.innerHTML =

                "<div class=\"card ok\">" +

                "<div class=\"big-status\">" +
                "Уборка начата" +
                "</div>" +

                "<div>" +
                "Начало работ зафиксировано" +
                "</div>" +

                "</div>";

            return;
        }


        if (
            data.result ===
            "NEED_PHOTO"
        ) {

            statusBox.innerHTML =

                "<div class=\"card\">" +

                "<div class=\"big-status\">" +
                "Завершение уборки" +
                "</div>" +

                "<p>Начало: " +
                data.started_at +
                "</p>" +

                "<p>Сделайте фото результата</p>" +

                "</div>";


            document.getElementById(
                "camera-button"
            ).style.display =
                "block";

            return;
        }


        throw new Error(
            "Неизвестный ответ API"
        );


    } catch (error) {

        showError(
            error.message
        );
    }
}


/* ==================================================
   ОСК — NFC CHECK-IN
================================================== */

async function inspectorTouch() {

    document.getElementById(
        "content"
    ).innerHTML =

        "<div class=\"card\">" +
        "<div class=\"big-status\">" +
        "ОСК" +
        "</div>" +
        "Подтверждаю контрольную точку..." +
        "</div>";


    try {

        const response =
            await fetch(

                OSK_API_URL,

                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "start_inspection_from_nfc",

                            task_id:
                                TEST_OSK_TASK_ID,

                            inspector_id:
                                INSPECTOR_ID
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            data.status !== "ok"
        ) {

            throw new Error(
                data.message ||
                "Ошибка начала проверки"
            );
        }


        let checklistHtml = "";


        if (data.checklist) {

            data.checklist.forEach(
                function(item) {

                    checklistHtml +=

                        "<div class=\"checklist-item\">" +

                        "<b>" +
                        item.item_no +
                        ".</b> " +

                        item.item_name +

                        "</div>";
                }
            );
        }


        document.getElementById(
            "content"
        ).innerHTML =

            "<div class=\"card ok\">" +

            "<div class=\"big-status\">" +
            "Контрольная точка подтверждена" +
            "</div>" +

            "<p><b>" +
            data.task.object_name +
            "</b></p>" +

            "<p>" +
            data.task.point_name +
            "</p>" +

            "<p>Проверка начата</p>" +

            "</div>";


        document.getElementById(
            "inspector-panel"
        ).innerHTML =

            "<div class=\"card\">" +

            "<h3>Задание ОСК</h3>" +

            "<p><b>" +
            data.task.title +
            "</b></p>" +

            "<p>Чек-лист: " +
            data.checklist.length +
            " пунктов</p>" +

            checklistHtml +

            "</div>" +

            "<div class=\"card ok\">" +

            "<div class=\"big-status\">" +
            "Продолжите работу в MAX" +
            "</div>" +

            "<div>" +
            "Чек-ин зафиксирован" +
            "</div>" +

            "</div>";


    } catch (error) {

        showError(
            error.message
        );
    }
}


/* ==================================================
   КАМЕРА
================================================== */

document.getElementById(
    "camera-button"
).onclick =
    function () {

        document.getElementById(
            "photo-input"
        ).click();
    };


/* ==================================================
   ОБРАБОТКА ФОТО
================================================== */

document.getElementById(
    "photo-input"
).addEventListener(

    "change",

    function (event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        const statusBox =
            document.getElementById(
                "employee-status"
            );


        statusBox.innerHTML =
            "<div class=\"card\">" +
            "Обрабатываю фото..." +
            "</div>";


        const reader =
            new FileReader();


        reader.onload =
            function (readerEvent) {

                const image =
                    new Image();


                image.onload =
                    function () {

                        let width =
                            image.width;

                        let height =
                            image.height;


                        if (
                            width >
                            MAX_PHOTO_SIZE ||

                            height >
                            MAX_PHOTO_SIZE
                        ) {

                            if (
                                width >
                                height
                            ) {

                                height =
                                    Math.round(
                                        height *
                                        MAX_PHOTO_SIZE /
                                        width
                                    );

                                width =
                                    MAX_PHOTO_SIZE;

                            } else {

                                width =
                                    Math.round(
                                        width *
                                        MAX_PHOTO_SIZE /
                                        height
                                    );

                                height =
                                    MAX_PHOTO_SIZE;
                            }
                        }


                        const canvas =
                            document.createElement(
                                "canvas"
                            );


                        canvas.width =
                            width;

                        canvas.height =
                            height;


                        const context =
                            canvas.getContext(
                                "2d"
                            );


                        context.drawImage(
                            image,
                            0,
                            0,
                            width,
                            height
                        );


                        const dataUrl =
                            canvas.toDataURL(
                                "image/jpeg",
                                JPEG_QUALITY
                            );


                        photoBase64 =
                            dataUrl.split(",")[1];


                        const preview =
                            document.getElementById(
                                "photo-preview"
                            );


                        preview.src =
                            dataUrl;

                        preview.style.display =
                            "block";


                        finishCleaning();
                    };


                image.onerror =
                    function () {

                        showError(
                            "Не удалось обработать фото"
                        );
                    };


                image.src =
                    readerEvent.target.result;
            };


        reader.onerror =
            function () {

                showError(
                    "Не удалось прочитать фото"
                );
            };


        reader.readAsDataURL(file);
    }
);


/* ==================================================
   ЗАВЕРШЕНИЕ УБОРКИ
================================================== */

async function finishCleaning() {

    const statusBox =
        document.getElementById(
            "employee-status"
        );


    statusBox.innerHTML =
        "<div class=\"card\">" +
        "Фиксирую завершение..." +
        "</div>";


    document.getElementById(
        "camera-button"
    ).style.display =
        "none";


    try {

        const response =
            await fetch(

                API_URL,

                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "finish_cleaning",

                            zone_id:
                                currentZoneId,

                            employee_id:
                                EMPLOYEE_ID,

                            photo:
                                photoBase64
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            data.status !== "ok"
        ) {

            throw new Error(
                data.message ||
                "Ошибка завершения"
            );
        }


        statusBox.innerHTML =

            "<div class=\"card ok\">" +

            "<div class=\"big-status\">" +
            "Уборка завершена" +
            "</div>" +

            "<div>" +
            "Результат зафиксирован" +
            "</div>" +

            "</div>";


        if (data.zone) {

            showZone(
                data.zone
            );
        }


        photoBase64 = null;


    } catch (error) {

        showError(
            error.message
        );
    }
}


/* ==================================================
   ОШИБКИ
================================================== */

function showError(message) {

    document.getElementById(
        "error"
    ).innerText =

        "ОШИБКА:\n" +
        message;
}


/* ==================================================
   ЗАПУСК
================================================== */

async function start() {

    setupRole();

    detectZone();

    showRole();


    /*
    ОСК имеет отдельный сценарий.
    Обычную карточку уборки инженеру
    вообще не загружаем.
    */

    if (
        currentRole ===
        "inspector"
    ) {

        await inspectorTouch();

        return;
    }


    /*
    Все остальные роли работают
    по старой схеме.
    */

    await loadZone();


    if (
        currentRole ===
        "cleaner"
    ) {

        await cleanerTouch();
    }
}


start();

</script>

</body>
</html>
