<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Грин Ривер</title>

    <script src="https://st.max.ru/js/max-web-app.js"></script>
</head>

<body>

<h2>Цифровой паспорт зоны</h2>

<div id="content">Загрузка...</div>

<div id="employee-panel" style="display:none; margin-top:25px;">
    <hr>

    <h3>Служебный режим</h3>

    <button
        id="clean-button"
        style="font-size:18px; padding:12px 20px;"
    >
        Уборка выполнена
    </button>

    <div
        id="result"
        style="margin-top:15px; white-space:pre-wrap;"
    ></div>
</div>


<script>

const GITHUB_TOKEN = "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";

const OWNER = "krypaevy-cpu";
const REPO = "max-zone-test";
const FILE = "zones.json";
const BRANCH = "main";

const API_URL =
    "https://api.github.com/repos/" +
    OWNER + "/" +
    REPO +
    "/contents/" +
    FILE;

let currentZoneId = null;
let currentUserId = null;


/* --------------------------------------------------
   ПОКАЗ КАРТОЧКИ ЗОНЫ
-------------------------------------------------- */

function showZone(zone) {

    document.getElementById("content").innerHTML =
        "<h3>" + zone.name + "</h3>" +
        "<p><b>Последняя уборка:</b> " +
        zone.last_cleaning +
        "</p>" +
        "<p><b>Статус:</b> " +
        zone.status +
        "</p>";
}


/* --------------------------------------------------
   ПЕРВИЧНАЯ ЗАГРУЗКА ЗОНЫ
-------------------------------------------------- */

async function loadZone() {

    const webApp = window.WebApp;

    currentZoneId =
        webApp &&
        webApp.initDataUnsafe &&
        webApp.initDataUnsafe.start_param;

    const user =
        webApp &&
        webApp.initDataUnsafe &&
        webApp.initDataUnsafe.user;

    if (user) {
        currentUserId = Number(user.id);
    }

    if (!currentZoneId) {

        document.getElementById("content").innerText =
            "Не удалось определить зону";

        return;
    }

    try {

        /*
        Для обычного просмотра читаем zones.json
        непосредственно с GitHub Pages.
        */

        const response = await fetch(
            "zones.json?ts=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {

            throw new Error(
                "Ошибка загрузки zones.json: HTTP " +
                response.status
            );
        }

        const zones = await response.json();

        if (!zones[currentZoneId]) {

            document.getElementById("content").innerText =
                "Зона не найдена";

            return;
        }

        showZone(
            zones[currentZoneId]
        );

        /*
        Пока служебный пользователь только один.
        */

        if (currentUserId === 58699171) {

            document.getElementById(
                "employee-panel"
            ).style.display = "block";
        }

    } catch (error) {

        document.getElementById("content").innerText =
            "Ошибка загрузки данных:\n" +
            error.message;
    }
}


/* --------------------------------------------------
   ФИКСАЦИЯ УБОРКИ
-------------------------------------------------- */

async function cleaningDone() {

    const result =
        document.getElementById("result");

    result.innerText =
        "Фиксирую уборку...";

    try {

        /*
        ШАГ 1.
        Получаем текущий файл через GitHub API.

        Репозиторий публичный, поэтому специально
        НЕ передаём GitHub-токен на чтение.
        */

        const getResponse = await fetch(
            API_URL + "?ref=" + BRANCH,
            {
                method: "GET",

                headers: {
                    "Accept":
                        "application/vnd.github+json",

                    "X-GitHub-Api-Version":
                        "2022-11-28"
                }
            }
        );

        if (!getResponse.ok) {

            const errorText =
                await getResponse.text();

            throw new Error(
                "Ошибка чтения GitHub\n" +
                "HTTP " +
                getResponse.status +
                "\n" +
                errorText
            );
        }

        const fileData =
            await getResponse.json();


        /*
        ШАГ 2.
        Декодируем содержимое zones.json.
        */

        const base64Text =
            fileData.content.replace(
                /\n/g,
                ""
            );

        const decodedText =
            decodeURIComponent(
                escape(
                    atob(base64Text)
                )
            );

        const zones =
            JSON.parse(decodedText);


        if (!zones[currentZoneId]) {

            throw new Error(
                "Зона " +
                currentZoneId +
                " не найдена"
            );
        }


        /*
        ШАГ 3.
        Формируем текущее время.
        */

        const now = new Date();

        const formatted =
            now.toLocaleString(
                "ru-RU",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            ).replace(",", "");


        /*
        ШАГ 4.
        Изменяем данные зоны.
        */

        zones[currentZoneId].last_cleaning =
            formatted;

        zones[currentZoneId].status =
            "Уборка выполнена";


        /*
        ШАГ 5.
        Превращаем обновлённый JSON обратно в Base64.
        */

        const newJson =
            JSON.stringify(
                zones,
                null,
                2
            );

        const encoded =
            btoa(
                unescape(
                    encodeURIComponent(
                        newJson
                    )
                )
            );


        /*
        ШАГ 6.
        Записываем новый zones.json на GitHub.

        Здесь GitHub-токен уже нужен.
        */

        const putResponse =
            await fetch(
                API_URL,
                {
                    method: "PUT",

                    headers: {
                        "Authorization":
                            "Bearer " +
                            GITHUB_TOKEN,

                        "Accept":
                            "application/vnd.github+json",

                        "X-GitHub-Api-Version":
                            "2022-11-28",

                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message:
                            "Cleaning completed from MAX Mini App",

                        content:
                            encoded,

                        sha:
                            fileData.sha,

                        branch:
                            BRANCH
                    })
                }
            );


        if (!putResponse.ok) {

            const errorText =
                await putResponse.text();

            throw new Error(
                "Ошибка записи GitHub\n" +
                "HTTP " +
                putResponse.status +
                "\n" +
                errorText
            );
        }


        /*
        ШАГ 7.
        Обновляем карточку прямо на экране.
        */

        result.innerText =
            "Уборка зафиксирована\n" +
            formatted;

        showZone(
            zones[currentZoneId]
        );


    } catch (error) {

        console.error(error);

        result.innerText =
            "ОШИБКА:\n" +
            error.message;
    }
}


/* --------------------------------------------------
   КНОПКА
-------------------------------------------------- */

document.getElementById(
    "clean-button"
).onclick = cleaningDone;


/* --------------------------------------------------
   СТАРТ
-------------------------------------------------- */

loadZone();

</script>

</body>
</html>
