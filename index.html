<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Грин Ривер — цифровой паспорт зоны</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            font-size: 18px;
            line-height: 1.45;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        h3 {
            font-size: 23px;
        }

        button {
            font-size: 18px;
            padding: 12px 20px;
            margin-top: 10px;
        }

        #last-cleaning-photo,
        #photo-preview {
            display: block;
            max-width: 100%;
            height: auto;
            margin-top: 12px;
            border-radius: 8px;
        }

        #photo-preview {
            display: none;
        }

        #employee-panel {
            display: none;
            margin-top: 28px;
        }

        #result {
            margin-top: 15px;
            white-space: pre-wrap;
        }

        #error {
            margin-top: 15px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h2>Цифровой паспорт зоны</h2>

<div id="content">
    Загрузка...
</div>


<div id="employee-panel">

    <hr>

    <h3>Служебный режим</h3>

    <input
        type="file"
        id="photo-input"
        accept="image/*"
        capture="environment"
        style="display:none;"
    >

    <button id="photo-button">
        Сделать фото
    </button>

    <div
        id="photo-status"
        style="margin-top:15px;"
    ></div>

    <img
        id="photo-preview"
        alt="Фото после уборки"
    >

    <button
        id="clean-button"
        style="display:none;"
    >
        Уборка выполнена
    </button>

    <div id="result"></div>

</div>


<div id="error"></div>


<script>

/* ==================================================
   НАСТРОЙКИ
================================================== */

const API_URL =
    "https://functions.yandexcloud.net/d4e0v5uck2oc0924pbeg";

const DEFAULT_ZONE_ID =
    "zone_test_01";

const MAX_PHOTO_SIZE =
    800;

const JPEG_QUALITY =
    0.45;


/* ==================================================
   ТЕКУЩЕЕ СОСТОЯНИЕ
================================================== */

let currentZoneId =
    null;

let photoBase64 =
    null;


/* ==================================================
   ТЕСТОВЫЙ СЛУЖЕБНЫЙ РЕЖИМ
================================================== */

/*
Обычная NFC-метка содержит:

?zone=zone_test_01


Чтобы один раз включить служебный режим
на телефоне уборщицы, открываем:

?zone=zone_test_01&employee=1


После этого браузер запомнит,
что это телефон сотрудника.


Чтобы отключить служебный режим:

?zone=zone_test_01&logout=1
*/

function setupEmployeeMode() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    if (
        params.get("employee") === "1"
    ) {

        localStorage.setItem(
            "green_river_employee",
            "1"
        );
    }


    if (
        params.get("logout") === "1"
    ) {

        localStorage.removeItem(
            "green_river_employee"
        );
    }
}


function isEmployee() {

    return (
        localStorage.getItem(
            "green_river_employee"
        ) === "1"
    );
}


/* ==================================================
   ОПРЕДЕЛЕНИЕ ЗОНЫ
================================================== */

function detectZone() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    currentZoneId =
        params.get("zone") ||
        DEFAULT_ZONE_ID;
}


/* ==================================================
   КАРТОЧКА ЗОНЫ
================================================== */

function showZone(zone) {

    const lastCleaning =
        zone.last_cleaning ||
        "Нет данных";

    const status =
        zone.status ||
        "Нет данных";

    let photoHtml =
        "";


    if (zone.photo_url) {

        photoHtml =
            "<p><b>Фото последней уборки:</b></p>" +

            "<img " +
            "id=\"last-cleaning-photo\" " +
            "src=\"" +
            zone.photo_url +
            "\" " +
            "alt=\"Фото последней уборки\"" +
            ">";
    }


    document.getElementById(
        "content"
    ).innerHTML =

        "<h3>" +
        zone.name +
        "</h3>" +

        "<p><b>Последняя уборка:</b> " +
        lastCleaning +
        "</p>" +

        "<p><b>Статус:</b> " +
        status +
        "</p>" +

        photoHtml;
}


/* ==================================================
   ЗАГРУЗКА ЗОНЫ
================================================== */

async function loadZone() {

    document.getElementById(
        "error"
    ).innerText =
        "";


    try {

        const response =
            await fetch(

                API_URL +

                "?zone=" +

                encodeURIComponent(
                    currentZoneId
                ) +

                "&ts=" +

                Date.now(),

                {
                    method:
                        "GET",

                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "API HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if (
            data.status !== "ok" ||
            !data.zone
        ) {

            throw new Error(
                data.message ||
                "Зона не найдена"
            );
        }


        showZone(
            data.zone
        );


        /*
        Служебные кнопки показываем
        только на телефоне сотрудника.
        */

        if (
            isEmployee()
        ) {

            document.getElementById(
                "employee-panel"
            ).style.display =
                "block";
        }


    } catch (error) {

        console.error(
            error
        );


        document.getElementById(
            "content"
        ).innerText =
            "Не удалось загрузить данные";


        document.getElementById(
            "error"
        ).innerText =
            "ОШИБКА:\n" +
            error.message;
    }
}


/* ==================================================
   КНОПКА "СДЕЛАТЬ ФОТО"
================================================== */

document.getElementById(
    "photo-button"
).onclick =
    function () {

        document.getElementById(
            "photo-input"
        ).click();
    };


/* ==================================================
   ОБРАБОТКА ФОТО
================================================== */

document.getElementById(
    "photo-input"
).addEventListener(

    "change",

    function (event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function (readerEvent) {

                const image =
                    new Image();


                image.onload =
                    function () {

                        let width =
                            image.width;

                        let height =
                            image.height;


                        /*
                        Уменьшаем фотографию
                        перед отправкой.
                        */

                        if (
                            width >
                            MAX_PHOTO_SIZE ||

                            height >
                            MAX_PHOTO_SIZE
                        ) {

                            if (
                                width >
                                height
                            ) {

                                height =
                                    Math.round(

                                        height *

                                        MAX_PHOTO_SIZE /

                                        width
                                    );

                                width =
                                    MAX_PHOTO_SIZE;

                            } else {

                                width =
                                    Math.round(

                                        width *

                                        MAX_PHOTO_SIZE /

                                        height
                                    );

                                height =
                                    MAX_PHOTO_SIZE;
                            }
                        }


                        const canvas =
                            document.createElement(
                                "canvas"
                            );


                        canvas.width =
                            width;

                        canvas.height =
                            height;


                        const context =
                            canvas.getContext(
                                "2d"
                            );


                        context.drawImage(
                            image,
                            0,
                            0,
                            width,
                            height
                        );


                        const dataUrl =
                            canvas.toDataURL(
                                "image/jpeg",
                                JPEG_QUALITY
                            );


                        photoBase64 =
                            dataUrl.split(",")[1];


                        /*
                        Показываем сделанное фото.
                        */

                        const preview =
                            document.getElementById(
                                "photo-preview"
                            );


                        preview.src =
                            dataUrl;


                        preview.style.display =
                            "block";


                        document.getElementById(
                            "photo-status"
                        ).innerText =
                            "Фото сделано";


                        /*
                        После фото появляется
                        кнопка фиксации уборки.
                        */

                        document.getElementById(
                            "clean-button"
                        ).style.display =
                            "inline-block";


                        document.getElementById(
                            "result"
                        ).innerText =
                            "";
                    };


                image.onerror =
                    function () {

                        document.getElementById(
                            "result"
                        ).innerText =
                            "Не удалось обработать фото";
                    };


                image.src =
                    readerEvent.target.result;
            };


        reader.onerror =
            function () {

                document.getElementById(
                    "result"
                ).innerText =
                    "Не удалось прочитать фото";
            };


        reader.readAsDataURL(
            file
        );
    }
);


/* ==================================================
   ФИКСАЦИЯ УБОРКИ
================================================== */

async function cleaningDone() {

    const result =
        document.getElementById(
            "result"
        );


    if (!photoBase64) {

        result.innerText =
            "Сначала сделайте фото";

        return;
    }


    const cleanButton =
        document.getElementById(
            "clean-button"
        );


    result.innerText =
        "Фиксирую уборку...";


    cleanButton.disabled =
        true;


    try {

        const response =
            await fetch(

                API_URL,

                {
                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            {

                                action:
                                    "cleaning_done",

                                zone_id:
                                    currentZoneId,

                                employee_id:
                                    "test_employee",

                                photo:
                                    photoBase64
                            }
                        )
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();


            throw new Error(

                "API HTTP " +

                response.status +

                "\n" +

                errorText
            );
        }


        const data =
            await response.json();


        if (
            data.status !== "ok"
        ) {

            throw new Error(

                data.message ||

                "Неизвестная ошибка API"
            );
        }


        result.innerText =
            "Уборка зафиксирована";


        /*
        Сразу обновляем карточку.
        */

        if (
            data.zone
        ) {

            showZone(
                data.zone
            );
        }


        /*
        Очищаем сделанное фото.
        */

        photoBase64 =
            null;


        document.getElementById(
            "photo-input"
        ).value =
            "";


        const preview =
            document.getElementById(
                "photo-preview"
            );


        preview.src =
            "";


        preview.style.display =
            "none";


        document.getElementById(
            "photo-status"
        ).innerText =
            "";


        cleanButton.style.display =
            "none";


        cleanButton.disabled =
            false;


    } catch (error) {

        console.error(
            error
        );


        result.innerText =
            "ОШИБКА:\n" +
            error.message;


        cleanButton.disabled =
            false;
    }
}


/* ==================================================
   КНОПКА ФИКСАЦИИ
================================================== */

document.getElementById(
    "clean-button"
).onclick =
    cleaningDone;


/* ==================================================
   ЗАПУСК
================================================== */

setupEmployeeMode();

detectZone();

loadZone();

</script>

</body>
</html>
